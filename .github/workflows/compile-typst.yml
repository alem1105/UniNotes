name: Compile Typst PDFs

on:
  push:
    branches: [main]
    paths:
      - "**/*.typ"

permissions:
  contents: write

concurrency:
  group: compile-typst
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Detect changed course folders
        id: folders
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          base="$EVENT_BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            commit_count=$(git rev-list --count HEAD)
            if [ "$commit_count" -le 1 ]; then
              echo "Prima commit della repo: nessuna diff calcolabile"
              {
                echo "dirs<<EOF"
                echo ""
                echo "EOF"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            base="HEAD~1"
          elif ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --depth=64 origin "$base" || true
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "::warning::Impossibile recuperare la commit di base $base, uso HEAD~1"
              base="HEAD~1"
            fi
          fi

          echo "Confronto tra $base e HEAD"

          changed_files=$(git diff --name-only "$base" HEAD -- '*.typ' || true)

          declare -A course_dirs
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            dir=$(dirname "$f")
            found=""
            while [ "$dir" != "." ] && [ "$dir" != "/" ]; do
              if [ -f "$dir/main.typ" ]; then
                found="$dir"
                break
              fi
              dir=$(dirname "$dir")
            done
            if [ -n "$found" ]; then
              course_dirs["$found"]=1
            else
              echo "::warning::Nessun main.typ trovato nelle cartelle superiori di '$f', file saltato"
            fi
          done <<< "$changed_files"

          changed_dirs=""
          for d in "${!course_dirs[@]}"; do
            changed_dirs+="$d"$'\n'
          done
          changed_dirs=${changed_dirs%$'\n'}

          echo "Cartelle-corso da ricompilare:"
          echo "$changed_dirs"

          {
            echo "dirs<<EOF"
            echo "$changed_dirs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile Typst files
        if: steps.folders.outputs.dirs != ''
        run: |
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            main_file="$dir/main.typ"
            if [ ! -f "$main_file" ]; then
              echo "::warning::Nessun main.typ trovato in '$dir', cartella saltata"
              continue
            fi
            pdf_name=$(basename "$dir" | tr '[:upper:]' '[:lower:]' | tr ' ' '_')
            echo "Compilazione di $main_file -> $dir/$pdf_name.pdf"
            typst compile --root . "$main_file" "$dir/$pdf_name.pdf"
          done <<< "${{ steps.folders.outputs.dirs }}"

      - name: Commit and push PDFs
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.pdf'
          if git diff --cached --quiet; then
            echo "Nessun PDF da aggiornare"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: recompile PDFs [skip ci]"
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  notify:
    name: Notify site repo
    needs: compile
    if: needs.compile.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Github REST API Call
        env:
          CI_TOKEN: ${{ secrets.CHILD_SECRET }}
          PARENT_REPO: alem1105/Quartz
          PARENT_BRANCH: v4
          WORKFLOW_ID: 131982789
        run: |
          curl -fL --retry 3 -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $CI_TOKEN" \
            https://api.github.com/repos/$PARENT_REPO/actions/workflows/$WORKFLOW_ID/dispatches \
            -d '{"ref":"'$PARENT_BRANCH'"}'
