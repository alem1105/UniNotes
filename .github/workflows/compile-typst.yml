name: Compile Typst PDFs

on:
  push:
    branches: [main]
    paths:
      - "**/*.typ"

permissions:
  contents: write

concurrency:
  group: compile-typst
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    outputs:
      pushed: ${{ steps.commit.outputs.pushed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Typst
        uses: typst-community/setup-typst@v5

      - name: Detect changed course folders
        id: folders
        run: |
          commit_count=$(git rev-list --count HEAD)
          if [ "$commit_count" -le 1 ]; then
            changed_dirs=""
          else
            changed_dirs=$(git diff --name-only HEAD~1 HEAD -- '*.typ' | grep '/' | cut -d/ -f1 | sort -u)
          fi
          {
            echo "dirs<<EOF"
            echo "$changed_dirs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Compile Typst files
        if: steps.folders.outputs.dirs != ''
        run: |
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            main_file="$dir/main.typ"
            if [ ! -f "$main_file" ]; then
              echo "::warning::Nessun main.typ trovato in '$dir', cartella saltata"
              continue
            fi
            pdf_name=$(basename "$dir" | tr '[:upper:]' '[:lower:]' | tr ' ' '_')
            echo "Compilazione di $main_file -> $dir/$pdf_name.pdf"
            typst compile --root . "$main_file" "$dir/$pdf_name.pdf"
          done <<< "${{ steps.folders.outputs.dirs }}"

      - name: Commit and push PDFs
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.pdf'
          if git diff --cached --quiet; then
            echo "Nessun PDF da aggiornare"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: recompile PDFs [skip ci]"
          git pull --rebase origin main
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  notify:
    name: Notify site repo
    needs: compile
    if: needs.compile.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Github REST API Call
        env:
          CI_TOKEN: ${{ secrets.CHILD_SECRET }}
          PARENT_REPO: alem1105/Quartz
          PARENT_BRANCH: v4
          WORKFLOW_ID: 131982789
        run: |
          curl -fL --retry 3 -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $CI_TOKEN" \
            https://api.github.com/repos/$PARENT_REPO/actions/workflows/$WORKFLOW_ID/dispatches \
            -d '{"ref":"'$PARENT_BRANCH'"}'
